name: Android build
on: [push, pull_request, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: KakaoMessageFilter-Android-install
          path: android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-release.html
