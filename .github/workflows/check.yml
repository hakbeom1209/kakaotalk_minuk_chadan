name: Verify and build
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor fonts-noto-cjk
      - run: python -m pip install -r requirements.txt && python -m pip install -e '.[dev]'
      - run: python -m kakao_filter --doctor
      - run: python -m pytest -q
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_config.py tests/test_windows.py tests/test_frames.py
      - run: .\scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: KakaoMessageFilter-Windows
          path: dist/KakaoMessageFilter.exe
