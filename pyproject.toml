[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kakao-message-filter"
version = "0.2.2"
description = "Local Windows KakaoTalk message masking prototype"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "numpy>=2,<3", "opencv-python-headless>=4.10,<5", "pytesseract>=0.3.13,<0.4", "mss>=10,<11"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
kakao-filter = "kakao_filter.app:main"

[tool.setuptools.packages.find]
include = ["kakao_filter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
